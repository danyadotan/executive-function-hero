<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Executive Function Hero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'VT323', monospace;
        --neon-pink: #f0f;
        --neon-cyan: #0ff;
        --neon-yellow: #ff0;
        --bg-color: #0d0221;
        background-color: var(--bg-color);
        text-shadow: 0 0 5px var(--neon-cyan), 0 0 10px var(--neon-cyan);
      }
      .font-pixel {
        font-family: 'Press Start 2P', cursive;
      }
      .font-dyslexia {
        font-family: 'Atkinson Hyperlegible', sans-serif;
      }
      .neon-border {
        border: 2px solid var(--neon-cyan);
        box-shadow: 0 0 5px var(--neon-cyan), 0 0 10px var(--neon-cyan) inset;
      }
      .neon-button:hover {
        background-color: rgba(0, 255, 255, 0.1);
        color: var(--neon-yellow);
        border-color: var(--neon-yellow);
        text-shadow: 0 0 5px var(--neon-yellow);
        box-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
      }
      .scanline-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        background: linear-gradient(to bottom, rgba(18, 18, 18, 0), rgba(18, 18, 18, 0.4) 50%, rgba(18, 18, 18, 0));
        background-size: 100% 3px;
        z-index: 9999;
        opacity: 0.5;
        animation: scanline 20s linear infinite;
      }
      @keyframes scanline {
        0% { background-position: 0 0; }
        100% { background-position: 0 100vh; }
      }
      @keyframes flicker {
        0%, 18%, 22%, 25%, 53%, 57%, 100% {
          text-shadow:
            0 0 4px var(--neon-pink),
            0 0 11px var(--neon-pink),
            0 0 19px var(--neon-pink);
        }
        20%, 24%, 55% {       
          text-shadow: none;
        }
      }
      .flicker-text {
        animation: flicker 2.5s infinite alternate;
      }
      @keyframes pop-out {
          0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
          40% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
          100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0; }
      }
      .animate-pop-out {
          animation: pop-out 2s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      }

      /* New Grid Background */
      #grid-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        --grid-color: rgba(0, 255, 255, 0.2);
        background-image:
          linear-gradient(var(--grid-color) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
        background-size: 40px 40px;
        perspective: 500px;
        animation: move-grid 40s linear infinite;
      }
      #grid-background::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 30%, var(--bg-color) 100%);
      }

      @keyframes move-grid {
          0% { background-position: 0 0; }
          100% { background-position: -1000px -1000px; }
      }

      /* New UI Panel Styling */
      .ui-panel {
        position: relative;
        border: 1px solid rgba(0, 255, 255, 0.3);
        background-color: rgba(13, 2, 33, 0.5);
        backdrop-filter: blur(2px);
      }
      .ui-corner {
        position: absolute;
        width: 20px;
        height: 20px;
        border-style: solid;
        border-color: var(--neon-cyan);
      }
      .ui-corner.top-left { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
      .ui-corner.top-right { top: -2px; right: -2px; border-width: 2px 2px 0 0; }
      .ui-corner.bottom-left { bottom: -2px; left: -2px; border-width: 0 0 2px 2px; }
      .ui-corner.bottom-right { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.1.1/",
    "react": "https://esm.sh/react@^19.1.1",
    "react-dom/": "https://esm.sh/react-dom@^19.1.1/",
    "@google/genai": "https://esm.sh/@google/genai@^1.13.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-black text-cyan-300">
    <div id="grid-background"></div>
    <div class="scanline-overlay"></div>
    <div id="root"></div>

  </body>
</html>
