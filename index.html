<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git Quest: Branch Hero - Learn Git Through Adventure!</title>
    <meta name="description" content="An AI-powered adventure game that teaches Git through storytelling. Guided by Keif the Kraken. Made for GitKon 2025." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'VT323', monospace;
        --neon-purple: #a855f7;
        --neon-cyan: #22d3ee;
        --neon-green: #22c55e;
        --bg-color: #0a0014;
        background-color: var(--bg-color);
        text-shadow: 0 0 5px var(--neon-cyan), 0 0 10px var(--neon-cyan);
      }
      .font-pixel {
        font-family: 'Press Start 2P', cursive;
      }
      .font-dyslexia {
        font-family: 'Atkinson Hyperlegible', sans-serif;
      }
      .neon-border {
        border: 2px solid var(--neon-purple);
        box-shadow: 0 0 5px var(--neon-purple), 0 0 10px var(--neon-purple) inset;
      }
      .neon-button:hover {
        background-color: rgba(168, 85, 247, 0.1);
        color: var(--neon-green);
        border-color: var(--neon-green);
        text-shadow: 0 0 5px var(--neon-green);
        box-shadow: 0 0 10px var(--neon-purple), 0 0 20px var(--neon-purple);
      }
      .scanline-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        background: linear-gradient(to bottom, rgba(18, 18, 18, 0), rgba(18, 18, 18, 0.4) 50%, rgba(18, 18, 18, 0));
        background-size: 100% 3px;
        z-index: 9999;
        opacity: 0.3;
        animation: scanline 20s linear infinite;
      }
      @keyframes scanline {
        0% { background-position: 0 0; }
        100% { background-position: 0 100vh; }
      }
      @keyframes flicker {
        0%, 18%, 22%, 25%, 53%, 57%, 100% {
          text-shadow:
            0 0 4px var(--neon-purple),
            0 0 11px var(--neon-purple),
            0 0 19px var(--neon-purple);
        }
        20%, 24%, 55% {
          text-shadow: none;
        }
      }
      .flicker-text {
        animation: flicker 2.5s infinite alternate;
      }
      @keyframes pop-out {
          0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
          40% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
          100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0; }
      }
      .animate-pop-out {
          animation: pop-out 2s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      }

      /* Git-themed Grid Background */
      #grid-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        --grid-color: rgba(168, 85, 247, 0.15);
        background-image:
          linear-gradient(var(--grid-color) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
        background-size: 40px 40px;
        perspective: 500px;
        animation: move-grid 40s linear infinite;
      }
      #grid-background::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 30%, var(--bg-color) 100%);
      }

      @keyframes move-grid {
          0% { background-position: 0 0; }
          100% { background-position: -1000px -1000px; }
      }

      /* UI Panel Styling - GitKraken themed */
      .ui-panel {
        position: relative;
        border: 1px solid rgba(168, 85, 247, 0.3);
        background-color: rgba(10, 0, 20, 0.7);
        backdrop-filter: blur(2px);
      }
      .ui-corner {
        position: absolute;
        width: 20px;
        height: 20px;
        border-style: solid;
        border-color: var(--neon-purple);
      }
      .ui-corner.top-left { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
      .ui-corner.top-right { top: -2px; right: -2px; border-width: 2px 2px 0 0; }
      .ui-corner.bottom-left { bottom: -2px; left: -2px; border-width: 0 0 2px 2px; }
      .ui-corner.bottom-right { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

      /* Commit graph animation */
      @keyframes pulse-commit {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      .animate-pulse-commit {
        animation: pulse-commit 2s ease-in-out infinite;
      }

    </style>
  <script type="module" crossorigin src="./assets/index-Crj1aQsO.js"></script>
</head>
  <body class="bg-black text-cyan-300">
    <div id="grid-background"></div>
    <div class="scanline-overlay"></div>
    <div id="root"></div>
  </body>
</html>
